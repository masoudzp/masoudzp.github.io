<li class="pub">
  <a class="pub-title" href="{{ include.pub.url }}">{{ include.pub.title }}</a>
  {% if include.show_tag and include.pub.tag %}<span class="pub-tag">{{ include.pub.tag }}</span>{% endif %}
  <div class="pub-authors">{{ include.pub.authors }}</div>
  <div class="pub-venue"><em>{{ include.pub.venue }}</em>, {{ include.pub.year }}<span class="pub-links"> · <a href="{{ include.pub.url }}">Paper</a>{% for l in include.pub.links %} · <a href="{{ l[1] | relative_url }}">{{ l[0] }}</a>{% endfor %}</span></div>
</li>
